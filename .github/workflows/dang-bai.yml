name: dang-bai

# Gọi qua HTTP:  POST https://api.github.com/repos/<OWNER>/<REPO>/dispatches
#   body: {"event_type":"dang-bai","client_payload":{...}}
# Hoặc bấm tay: tab Actions → dang-bai → Run workflow.

# CÒ CHÍNH vẫn là Lark: automation "Tại thời gian kích hoạt của bản ghi" đọc cột "Lịch đăng bài"
# của bảng 14.3 và bắn repository_dispatch — đo thật: lệch 9 GIÂY. Đó là thứ cho bài lên ĐÚNG GIỜ.
#
# ⚠️ Lịch sử: cron GitHub từng bị gỡ ngày 2026-09-12 vì đo thật thấy TRỄ 4 TIẾNG
# (đặt 00:00-00:20 UTC, thực tế nổ 04:12-04:24 UTC). Làm CÒ CHÍNH thì trễ vậy là vô nghĩa.
#
# ✅ Bật lại ngày 2026-11-23, nhưng CHỈ LÀM LƯỚI DỰ PHÒNG, không phải cò chính.
# Lý do: proxy ra Internet của Lark hỏng chập chờn (proxyconnect tcp: dial tcp 10.100.4.74:8080),
# ngày 23/11 hỏng 6/10 lệnh buổi sáng. Lệnh quét bù đặt trong Lark cũng đi qua đúng proxy đó
# nên chết theo. Cron GitHub KHÔNG phụ thuộc Lark chút nào, nên vớt được.
# Chạy không có record_id => post-feed.js quét cả bảng 14.3, bỏ qua dòng đã "Thành công"
# và dòng hẹn giờ tương lai, chỉ đăng dòng đã tới giờ mà còn trống trạng thái.
# Ngày bình thường nó chạy không công. Trễ 1-4 tiếng vẫn hơn là bài không lên.
#
# 2026-11-25: repo chuyển sang PUBLIC => Actions MIỄN PHÍ KHÔNG GIỚI HẠN, hết lo hạn mức phút.
# Nhờ vậy nới lịch từ 16 mốc/ngày (2 khung) lên 48 mốc/ngày (30 phút/lần, suốt ngày đêm).
# Cần nới vì đo thật 23-25/11: GitHub BỎ khoảng 87% số mốc đã đặt, mốc nào chạy thì
# thường trễ 6-8 tiếng. Đặt dày là cách duy nhất để tăng xác suất có mốc thật sự nổ.
# Phút lẻ :07 và :37 thay vì :00 và :30 — GitHub dồn tải ở đầu giờ nên đặt lệch sẽ bớt trễ.
on:
  schedule:
    - cron: '7,37 * * * *'      # 30 phút/lần, 24/7 — vớt bài sót bất kể khung nào
  repository_dispatch:
    types: [dang-bai]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Để trống = UPSERT (có thì cập nhật, chưa có thì tạo mới) | --skip-existing = chỉ thêm mới | --dry-run = chạy thử'
        required: false
        default: ''
      record_id:
        description: 'record_id của 1 dòng cần đăng ngay (để trống = quét cả bảng theo lịch)'
        required: false
        default: ''

concurrency:
  group: dang-bai
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Đăng bài / Reel từ bảng 14.3 lên Facebook
        env:
          # Bí mật — Settings → Secrets and variables → Actions → Secrets
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          FB_USER_TOKEN:   ${{ secrets.FB_USER_TOKEN }}
          # Cấu hình — Settings → Secrets and variables → Actions → Variables
          LARK_APP_ID:     ${{ github.event.client_payload.lark_app_id || vars.LARK_APP_ID }}
          LARK_BASE_ID:    ${{ github.event.client_payload.base_id || vars.LARK_BASE_ID }}
          LARK_DOMAIN:     ${{ vars.LARK_DOMAIN }}
          TABLE_DANGBAI:   ${{ github.event.client_payload.table_dangbai || vars.TABLE_DANGBAI }}
          TABLE_PAGES:     ${{ github.event.client_payload.table_pages || vars.TABLE_PAGES }}
          RECORD_ID:       ${{ github.event.client_payload.record_id || github.event.inputs.record_id }}
          RESPECT_SCHEDULE: ${{ github.event.client_payload.respect_schedule }}
          REEL_CHUNK_MB:   ${{ github.event.client_payload.reel_chunk_mb }}
        run: node scripts/post-feed.js ${{ github.event.client_payload.mode || github.event.inputs.mode }}
